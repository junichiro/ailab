[project]
name = "ailab"
version = "0.1.0"
description = "A workspace for experimenting with AI-assisted development tools and AWS AI services"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Junichiro Tobe"}
]
dependencies = [
    "boto3>=1.40.56",
    "httpx>=0.28.1",
    "pydantic>=2.10.3",
    "typer>=0.15.1",
    "rich>=13.9.4",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "black>=24.10.0",
    "isort>=5.13.2",
    "mypy>=1.13.0",
    "ruff>=0.8.4",
    "pre-commit>=4.0.1",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["main.py", "constants.py"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
